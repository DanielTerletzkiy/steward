# Release: push a tag like v0.2.0 (matching `version` in app/config.yaml). This
# - builds the app image for amd64 and aarch64 and pushes it to ghcr.io, where the app store pulls it;
# - creates a GitHub release with zips for manual installation (the app folder and the integration),
#   and the kitchen terminal's Raspberry Pi setup script.
# Run it by hand (Actions → Release → Run workflow) to rebuild the images without a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  stage:
    name: Stage the app
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Check versions
        run: |
          version=$(sed -nE 's/^version: *"?([^"]+)"?.*/\1/p' app/config.yaml)
          integration=$(jq -r .version custom_components/steward/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$integration" != "$version" ]]; then
            echo "::error::app/config.yaml is $version but the integration's manifest.json is $integration"; exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in app/config.yaml"; exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: dev/scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/ha-app/steward
          include-hidden-files: true

  image:
    name: Image (${{ matrix.arch }})
    needs: stage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: steward
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch }}-steward" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: steward
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ needs.stage.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.stage.outputs.version }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  release:
    name: GitHub release
    needs: [stage, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: dist/steward
      - name: Zip the app and the integration
        run: |
          version=${{ needs.stage.outputs.version }}
          (cd dist && zip -qr "steward-app-$version.zip" steward)
          (cd custom_components && zip -qr "../dist/steward-integration-$version.zip" steward -x '*/__pycache__/*')
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${{ needs.stage.outputs.version }}
          gh release create "$GITHUB_REF_NAME" --title "Steward $version" --generate-notes \
            "dist/steward-app-$version.zip" "dist/steward-integration-$version.zip" kiosk/setup-pi.sh
