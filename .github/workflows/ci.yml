# Tests and checks for every push to master and every pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # The eBon parser's own metadata pulls in dev tools; its runtime needs only the server's dependencies.
      - run: uv pip install --no-deps rewe-ebon-parser
      - run: .venv/bin/python -m pytest -q
        env:
          TZ: Europe/Berlin

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check server custom_components

  frontend:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Type-checks, then builds into server/steward_server/static.
      - run: npm run build

  hassfest:
    name: Integration (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
