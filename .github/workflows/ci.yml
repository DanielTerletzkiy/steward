# Tests and checks for every push to master and every pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      # The eBon parser's own metadata pulls in dev tools; its runtime needs only the server's dependencies.
      - run: uv pip install --no-deps rewe-ebon-parser
      - run: .venv/bin/python -m pytest -q
        env:
          TZ: Europe/Berlin

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff check server custom_components

  frontend:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Type-checks, then builds into server/steward_server/static.
      - run: npm run build

  kiosk:
    name: Kiosk app
    runs-on: ubuntu-latest
    # Debian Bookworm, like the release build: the packages must run on Raspberry Pi OS Bookworm.
    container: debian:bookworm
    defaults:
      run:
        working-directory: kiosk/src-tauri
    steps:
      - name: Install build tools and libraries
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates git \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev libssl-dev
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kiosk/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  ansible:
    name: Ansible role
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Uses ansible/.ansible-lint (production profile).
      - run: uvx ansible-lint

  hassfest:
    name: Integration (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
