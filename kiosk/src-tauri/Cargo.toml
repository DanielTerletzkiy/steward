[package]
name = "steward-kiosk"
version = "0.5.1"
description = "Steward kitchen terminal: Steward's kiosk page full screen, with Bluetooth pairing and screen control"
authors = ["Daniel Terletzkiy"]
repository = "https://github.com/DanielTerletzkiy/steward"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
humantime = "2"
libc = "0.2"
signal-hook = "0.3"
tokio = { version = "1", features = ["macros", "sync", "time"] }
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_38"] }
gtk = "0.18"
glib = "0.18"
bluer = { version = "0.17", features = ["bluetoothd"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
