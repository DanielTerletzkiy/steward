---
- name: Install BlueZ
  ansible.builtin.apt:
    name:
      - bluez
      - rfkill
    state: present

- name: Start Bluetooth with the system
  ansible.builtin.systemd_service:
    name: bluetooth
    enabled: true
    state: started
  when: ansible_facts['service_mgr'] | default('') == 'systemd'

- name: Check whether Bluetooth is blocked
  ansible.builtin.command: rfkill list bluetooth
  register: steward_kiosk__rfkill
  changed_when: false
  failed_when: false
  check_mode: false

- name: Unblock Bluetooth
  ansible.builtin.command: rfkill unblock bluetooth
  when: "'Soft blocked: yes' in steward_kiosk__rfkill.stdout"
  changed_when: true

- name: Let the kiosk user pair devices
  ansible.builtin.user:
    name: "{{ steward_kiosk_user }}"
    groups: bluetooth
    append: true
  notify: Steward kiosk needs a reboot
