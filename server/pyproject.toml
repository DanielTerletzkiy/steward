[project]
name = "steward-server"
version = "0.2.0"
description = "Steward: household management server for Home Assistant"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11",
    "rapidfuzz>=3.10",
    "pytz",
    "tqdm",
    "pillow>=11",
    "httpx>=0.27",
    "anthropic>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steward_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
